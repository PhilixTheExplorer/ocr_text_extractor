[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lexo"
version = "0.1.0"
description = "Local-first desktop document OCR: PDF operations, smart OCR routing, and Burmese-first text handling."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "PhilixTheExplorer" }]
keywords = ["ocr", "pdf", "burmese", "myanmar", "document", "text-extraction", "desktop"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Operating System :: OS Independent",
  "Topic :: Text Processing",
  "Topic :: Utilities",
]
dependencies = [
  "typer>=0.12",
  "pydantic-settings>=2.3",
  "structlog>=24.1",
  "platformdirs>=4.2",
  "pymupdf>=1.24",
  "google-api-python-client>=2.0",
  "google-auth-oauthlib>=1.2",
  "google-auth-httplib2>=0.2",
  "keyring>=25.0",
  "packaging>=24.0",
  "pillow>=10.0",
  "PySide6>=6.8",
]

[project.scripts]
lexo = "lexo.cli.app:main"

[project.urls]
Homepage = "https://github.com/PhilixTheExplorer/lexo"
Repository = "https://github.com/PhilixTheExplorer/lexo"

[dependency-groups]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lexo"]

[tool.hatch.build.targets.sdist]
include = ["src/lexo", "README.md", "LICENSE", "docs"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.flake8-bugbear]
# Typer's Argument()/Option() calls in parameter defaults are intentional.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
  "pymupdf",
  "pymupdf.*",
  "googleapiclient.*",
  "google.*",
  "google_auth_oauthlib.*",
  "google_auth_httplib2",
  "httplib2",
  "PIL.*",
  "keyring",
  "keyring.*",
  "PySide6",
  "PySide6.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# GUI glue is verified by running, not type-checking, against an external toolkit.
module = ["lexo.gui.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
